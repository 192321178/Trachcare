 often needed after</text><text id="Body 3" x="36" y="412" font-family="Plus Jakarta Sans, Inter, ui-sans-serif, sans-serif" font-size="12" font-weight="500" fill="#3B554E" text-anchor="start">respiratory failure or trauma. After the</text><text id="Body 4" x="36" y="429" font-family="Plus Jakarta Sans, Inter, ui-sans-serif, sans-serif" font-size="12" font-weight="500" fill="#3B554E" text-anchor="start">operation, daily airway management prevents</text><text id="Body 5" x="36" y="446" font-family="Plus Jakarta Sans, Inter, ui-sans-serif, sans-serif" font-size="12" font-weight="500" fill="#3B554E" text-anchor="start">complications - and doing that well at home is</text><text id="Body 6" x="36" y="463" font-family="Plus Jakarta Sans, Inter, ui-sans-serif, sans-serif" font-size="12" font-weight="500" fill="#3B554E" text-anchor="start">hard.</text></g><g id="Expansion 2 / Mobile health in tracheostomy care"><g id="Shadow"><rect id="shadow 0" x="23.6" y="504.9" width="342.8" height="66.4" rx="23" fill="rgba(15,42,36,0.10)" opacity="0.055"/><rect id="shadow 1" x="23" y="503.75" width="344" height="65" rx="22.5" fill="rgba(15,42,36,0.10)" opacity="0.055"/><rect id="shadow 2" x="22.4" y="502.6" width="345.2" height="63.6" rx="22" fill="rgba(15,42,36,0.10)" opacity="0.055"/><rect id="shadow 3" x="21.8" y="501.45" width="346.4" height="62.2" rx="21.5" fill="rgba(15,42,36,0.10)" opacity="0.055"/><rect id="shadow 4" x="21.2" y="500.3" width="347.6" height="60.8" rx="21" fill="rgba(15,42,36,0.10)" opacity="0.055"/><rect id="shadow 5" x="20.6" y="499.15" width="348.8" height="59.4" rx="20.5" fill="rgba(15,42,36,0.10)" opacity="0.055"/></g><rect id="Expansion 2 / Mobile health in tracheostomy care" x="20" y="498" width="350" height="58" rx="20" fill="#FFFFFF"/></g><g id="Expansion / Mobile health in tracheostomy care"><rect id="Icon chip" x="36" y="510" width="34" height="34" rx="12" fill="#DFF3E6"/><g id="icon / Icon" transform="translate(45 519) scale(0.708)"><path fill="none" s